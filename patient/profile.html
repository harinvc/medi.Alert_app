<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Profile | MedAlert AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="bi bi-heart-pulse-fill text-danger me-2"></i>MedAlert AI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#profileNavbar" aria-controls="profileNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="profileNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <a class="btn btn-outline-light btn-sm me-2 rounded-pill px-3" href="dashboard.html">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-danger btn-sm rounded-pill px-3" id="logoutBtn">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                
                <!-- Alert Container -->
                <div id="profileAlertContainer"></div>

                <!-- Profile Card -->
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-2 px-4 d-flex justify-content-between align-items-center">
                        <h4 class="fw-bold mb-0 text-primary">
                            <i class="bi bi-person-lines-fill me-2"></i>Patient Profile
                        </h4>
                        <div>
                            <button type="button" id="editProfileBtn" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-bold shadow-sm">
                                <i class="bi bi-pencil-square me-1"></i> Edit
                            </button>
                        </div>
                    </div>
                    
                    <div class="card-body px-4 pb-4">
                        <form id="profileForm">
                            <div class="row g-4">
                                
                                <!-- Basic Info Section -->
                                <div class="col-12">
                                    <h6 class="text-muted fw-bold border-bottom pb-2 mb-3">Basic Information</h6>
                                </div>
                                
                                <div class="col-md-6">
                                    <label for="fullName" class="form-label fw-semibold">Full Name</label>
                                    <input type="text" class="form-control bg-light" id="fullName" name="fullName" value="Loading..." readonly>
                                </div>
                                
                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-semibold">Email Address</label>
                                    <input type="email" class="form-control bg-light" id="email" name="email" value="Loading..." readonly>
                                </div>

                                <div class="col-md-6">
                                    <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                    <input type="tel" class="form-control bg-light" id="phone" name="phone" value="Loading..." readonly>
                                </div>

                                <div class="col-md-6">
                                    <label for="dateOfBirth" class="form-label fw-semibold">Date of Birth</label>
                                    <input type="date" class="form-control bg-light" id="dateOfBirth" name="dateOfBirth" readonly>
                                </div>

                                <!-- Medical Info Section -->
                                <div class="col-12 mt-5">
                                    <h6 class="text-muted fw-bold border-bottom pb-2 mb-3">Medical Details</h6>
                                </div>

                                <div class="col-md-6">
                                    <label for="bloodGroup" class="form-label fw-semibold">Blood Group</label>
                                    <select class="form-select bg-light" id="bloodGroup" name="bloodGroup" disabled>
                                        <option value="">Select Blood Group</option>
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="emergencyContact" class="form-label fw-semibold">Emergency Contact</label>
                                    <input type="tel" class="form-control bg-light" id="emergencyContact" name="emergencyContact" placeholder="+1234567890" readonly>
                                </div>

                                <div class="col-12">
                                    <label for="allergies" class="form-label fw-semibold">Allergies</label>
                                    <textarea class="form-control bg-light" id="allergies" name="allergies" rows="2" placeholder="List any known allergies (e.g., Peanuts, Penicillin)" readonly></textarea>
                                </div>

                                <div class="col-12">
                                    <label for="medicalConditions" class="form-label fw-semibold">Existing Medical Conditions</label>
                                    <textarea class="form-control bg-light" id="medicalConditions" name="medicalConditions" rows="3" placeholder="List any pre-existing conditions (e.g., Diabetes, Hypertension)" readonly></textarea>
                                </div>

                                <!-- Action Buttons -->
                                <div class="col-12 mt-4 d-none" id="saveActionContainer">
                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="button" id="cancelEditBtn" class="btn btn-light rounded-pill px-4 fw-bold">Cancel</button>
                                        <button type="submit" id="saveProfileBtn" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
                                            <i class="bi bi-check-circle me-1"></i> Save Changes
                                        </button>
                                    </div>
                                </div>

                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <!-- Logic to toggle read-only states and fetch/save data goes in profile.js -->
    <script type="module" src="../js/profile.js"></script>
</body>
</html>
